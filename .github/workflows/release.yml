name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          cd .build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent \
            ClipSaver.app "$GITHUB_WORKSPACE/ClipSaver-${GITHUB_REF_NAME}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipSaver-${{ github.ref_name }}
          path: ClipSaver-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "ClipSaver-${GITHUB_REF_NAME}.zip"
          --title "ClipSaver ${GITHUB_REF_NAME}"
          --generate-notes
