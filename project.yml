name: ClipSaver
options:
  bundleIdPrefix: com.jed.clipsaver
  createIntermediateGroups: true
targets:
  ClipSaver:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ClipSaver
        excludes:
          - Info.plist
          - ClipSaver.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jed.clipsaver
        INFOPLIST_FILE: Sources/ClipSaver/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ClipSaver/ClipSaver.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: ClipSaverShare
        embed: true
        codeSign: true
  ClipSaverShare:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ClipSaverShare
        excludes:
          - Info.plist
          - ClipSaverShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jed.clipsaver.share
        INFOPLIST_FILE: Sources/ClipSaverShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/ClipSaverShare/ClipSaverShare.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
